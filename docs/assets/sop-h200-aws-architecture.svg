<title id="title">Karpo SOP：AWS 八 H200 实测部署架构</title>
<desc id="desc">一台 p5en.48xlarge Spot EC2，位于俄亥俄 us-east-2a。压测客户端、最少在途请求代理和八个单卡 vLLM 副本全部同机部署。每次输入完整 200 候选，每张 H200 运行完整 Karpo 4B FP8 模型，最大 batch 4。</desc>
